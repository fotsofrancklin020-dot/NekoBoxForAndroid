name: Build XXX-CORE-2.0 PRO VPN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "APK trouvé : $APK_PATH"
          cp "$APK_PATH" XXX-CORE-2.0-PRO-VPN.apk
          ls -lh XXX-CORE-2.0-PRO-VPN.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XXX-CORE-2.0-PRO-VPN
          path: XXX-CORE-2.0-PRO-VPN.apk
          retention-days: 30

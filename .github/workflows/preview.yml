name: Build NekoBox XXX-CORE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOssRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XXX-CORE-2.0-PRO-VPN
          path: app/build/outputs/apk/oss/release/*.apk

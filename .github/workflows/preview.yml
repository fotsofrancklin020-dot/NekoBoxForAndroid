name: Build XXX-CORE-2.0 PRO VPN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "APK trouvé : $APK_PATH"
          cp "$APK_PATH" XXX-CORE-2.0-PRO-VPN.apk
          ls -lh XXX-CORE-2.0-PRO-VPN.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XXX-CORE-2.0-PRO-VPN
          path: XXX-CORE-2.0-PRO-VPN.apk
          retention-days: 30

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: XXX-CORE-2.0 PRO VPN v2.0.0
          body: |
            ## XXX-CORE-2.0 PRO VPN
            ### 📱 Télécharger et Installer
            1. Télécharge XXX-CORE-2.0-PRO-VPN.apk
            2. Ouvre le fichier sur ton téléphone
            3. Autorise "Sources inconnues" si demandé
            4. Installe et Connecte 🚀
            
            **Protocoles:** VLESS / VMESS / SSH / Trojan
          files: XXX-CORE-2.0-PRO-VPN.apk
          draft: false
          prerelease: false
          make_latest: true
